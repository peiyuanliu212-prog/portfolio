name: keepwarm-relay

# Ping the free Render relay entry every 10 minutes so it never sleeps
# (Render free instances spin down after ~15 min idle; cold start ~1 min).
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping relay health
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 120 https://huan-relay.onrender.com/health || echo "000")
            echo "attempt $i -> $code"
            [ "$code" = "200" ] && exit 0
            sleep 15
          done
          echo "relay did not return 200"
          exit 1
